<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="box header wrap">
    <a href="{{ '/' | relative_url }}">{{ site.author | escape }} 的主页</a>
    <nav aria-label="主导航"><a href="{{ '/' | relative_url }}#notes">笔记</a><a href="{{ '/' | relative_url }}#about">关于</a><a href="https://github.com/{{ site.github_username }}">GitHub</a></nav>
  </header>
  <main id="main" class="wrap">{{ content }}</main>
  <footer class="box footer wrap"><span>© {{ site.time | date: '%Y' }} {{ site.author | escape }}</span></footer>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
</head>
<body>
  <header class="site-header"><div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark">Y/</span><span>论文阅读地图</span></a>
    <nav aria-label="主导航"><a href="{{ '/' | relative_url }}#map">脉络</a><a href="{{ '/' | relative_url }}#papers">论文</a><a href="{{ '/study-notes/' | relative_url }}">旧笔记</a><a href="https://github.com/{{ site.github_username }}">GitHub ↗</a></nav>
  </div></header>
  <main id="main" class="wrap">{{ content }}</main>
  <footer class="site-footer wrap"><span>© {{ site.time | date: '%Y' }} {{ site.author | escape }}</span><span>一篇一篇读，一张一张记。</span></footer>
</body>
</html>
